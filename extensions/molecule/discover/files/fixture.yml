  kernel: 6.14-old
  hardware:
    cpu: Old CPU
    cpus: 24
  disks:
    - dev: nvme0n1
      size: 3.6T
      role: rpool (ZFS root)
    - dev: sda
      size: 3.6T
      role: tank (ZFS)
  network:
    vmbr0:
      ip: 192.0.2.10/24
      role: mgmt/LAN
  guests:
    vms:
      - id: 9400
        name: Home-Velo
        status: running
cluster:
