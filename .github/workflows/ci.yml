---
# CI for the get_sybers.cluster collection (doc/standards/03, doc/standards/04).
#
# Self-contained rather than calling the org's reusable workflows, mirroring
# get-sybers/lxc so the two collections' gates stay identical; every action
# is hash-pinned (pinact bumps them), and the runner's own python3 is used
# wherever no action is needed.
#
# Shape. `lint` (prek over every file, the must-have files) and `plan` run on
# every event. `plan` reads the change and decides the lanes
# (scripts/molecule_lanes.py): a docs-only change skips the heavy gates, a role
# change runs only the molecule scenarios that drive that role, a change to
# anything the scenarios share runs them all, and push, schedule and dispatch
# always run everything. `ansible` is the collection gate (ansible-lint, pins,
# sanity, changelog, build); `molecule` fans the selected scenarios out over
# parallel lanes. `all_green` is the one required check and treats a skipped
# lane as green and a failed one as red.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # The toolchain pins the collection gate and every molecule lane share
  # (docs/04 §9); the hook versions live in .pre-commit-config.yaml.
  ANSIBLE_CORE_PIN: "2.21.5"
  ANSIBLE_LINT_PIN: "26.9.0"
  PREK_PIN: "0.5.5"
  # How many molecule lanes a change fans out over at most.
  MOLECULE_LANES: "4"
jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Must-have files (docs/04)
        run: |
          missing=0
          for f in galaxy.yml requirements.yml meta/runtime.yml .ansible-lint .yamllint \
                   tox.ini tox-ansible.ini requirements.txt test-requirements.txt \
                   changelogs/config.yaml scripts/check_pins.py scripts/molecule_lanes.py \
                   Makefile LICENSE README.md CHANGELOG.md SECURITY.md \
                   CONTRIBUTING.md CODE_OF_CONDUCT.md MAINTAINERS AUTHORS \
                   doc/index.md inventory/example/hosts.yml; do
            if [ ! -e "$f" ]; then echo "::error::missing must-have file: $f"; missing=1; fi
          done
          grep -q '^## \[Unreleased\]' CHANGELOG.md || { echo "::error::CHANGELOG.md has no [Unreleased] section"; missing=1; }
          exit "$missing"
      - name: Cache prek's hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-
      - name: Install prek
        run: |
          python3 -m pip install --user "prek==$PREK_PIN"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: prek (all hooks, all files)
        # no-commit-to-branch guards developers against committing to main locally;
        # on the push-to-main run HEAD *is* main. ansible-lint runs once, in the
        # `ansible` job, where the pinned collections are installed for it.
        env:
          SKIP: no-commit-to-branch,ansible-lint
        run: prek run --all-files --show-diff-on-failure
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      heavy: ${{ steps.lanes.outputs.heavy }}
      scenarios: ${{ steps.lanes.outputs.scenarios }}
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - name: Checkout (full history, so the pull request's merge base is present)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide the lanes this change needs
        id: lanes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/molecule_lanes.py --event "$EVENT" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --lanes "$MOLECULE_LANES" | tee -a "$GITHUB_OUTPUT"
  ansible:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13 (the sanity tox env requires it)
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test-requirements.txt
      - name: Install toolchain
        run: |
          python3 -m pip install --user -r test-requirements.txt "ansible-core==$ANSIBLE_CORE_PIN" "ansible-lint==$ANSIBLE_LINT_PIN"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache the pinned collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Install pinned collections (requirements.yml)
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint --profile production
        run: ansible-lint --profile production
      - name: Pin discipline (§2/§13)
        run: python3 scripts/check_pins.py --resolve-git
      - name: Cache ansible-test's environments
        # The exact interpreter is part of the key. ansible-test's sanity venv
        # (~/.ansible/test/venv/sanity/3.13/<hash>/) links the Python it was
        # created from by absolute path (/opt/hostedtoolcache/Python/3.13.N/...),
        # and a runner image that ships the next patch release removes that
        # path, so a cache saved under the previous release fails every run
        # ("Required program .../bin/python not found") until the key moves.
        # tox rebuilds .tox on its own when the interpreter changes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
        with:
          path: |
            ~/.ansible/test
            .tox
          key: sanity-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ env.ANSIBLE_CORE_PIN }}-${{ hashFiles('test-requirements.txt', 'tox-ansible.ini') }}
      - name: Sanity (ansible-test via tox-ansible)
        run: tox --ansible -e sanity-py3.13-2.21 --conf tox-ansible.ini
      - name: Changelog lint
        run: antsibull-changelog lint
      - name: Build artifact
        run: ansible-galaxy collection build --force --output-path dist/
  molecule:
    needs: plan
    if: needs.plan.outputs.lanes != '[]'
    name: molecule (${{ join(matrix.lane, ', ') }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test-requirements.txt
      - name: Install toolchain
        run: |
          python3 -m pip install --user -r test-requirements.txt "ansible-core==$ANSIBLE_CORE_PIN"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache the pinned collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Install pinned collections (requirements.yml)
        run: ansible-galaxy collection install -r requirements.yml
      - name: Molecule (converge, idempotence, verify, negative)
        env:
          LANE: ${{ join(matrix.lane, ' ') }}
        run: |
          for scenario in $LANE; do
            echo "::group::molecule test -s $scenario"
            molecule test -s "$scenario"
            echo "::endgroup::"
          done
  all_green:
    name: all_green
    if: ${{ always() }}
    needs: [lint, plan, ansible, molecule]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
