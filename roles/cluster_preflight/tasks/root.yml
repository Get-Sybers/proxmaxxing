---
- name: "root | Read the effective user"
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", "user"]
  register: __cpf_user
  delegate_to: "{{ cluster_preflight_delegate_to }}"
  delegate_facts: true
- name: "root | Assert running as root"
  ansible.builtin.assert:
    that: __cpf_user['ansible_facts']['user_uid'] | int == 0
    fail_msg: >-
      cluster plays run as root on the PVE node (uid here:
      {{ __cpf_user['ansible_facts']['user_uid'] }}). This is the irreducible operator-root
      tier — re-run as root; there is no sudo/become path.
    quiet: true
