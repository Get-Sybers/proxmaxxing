---
# Role-internal data (not inputs).

# The config.yml keys the reconcile must NOT write with a plain lineinfile:
# the secret keys (handled by the match-only check in config.yml) and — unless
# the operator opted in — the host network keys. Everything else in
# cluster_ludus_install_config is reconciled. Lazily templated so the opt-in is
# read at use time.
cluster_ludus_install_skip_keys: >-
  {{ cluster_ludus_install_secret_keys
     + (cluster_ludus_install_network_keys
        if not (cluster_ludus_install_manage_network | bool) else []) }}
