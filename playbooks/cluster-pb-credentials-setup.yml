---
- name: "Ensure the gs_infra_credentials collection"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Refuse --check"
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: >-
          This play creates/patches a PocketBase collection via API calls that
          check mode cannot simulate and must not half-run. Re-run without
          --check.
        quiet: true
    - name: "Cluster admission gate"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_preflight
    - name: "Ensure the credentials collection (create/reconcile/verify)"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
    - name: "Mint a throwaway value (random, never a real secret)"
      ansible.builtin.set_fact:
        __selftest_value: >-
          {{ lookup('ansible.builtin.password',
                    '/dev/null length=24 chars=ascii_letters,digits') }}
      no_log: true
      when: cluster_pb_selftest | bool
    - name: "Write the throwaway record"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
        tasks_from: record_write
      vars:
        cluster_pb_store_record_name: "{{ pb_selftest_record_name }}"
        cluster_pb_store_record_value: "{{ __selftest_value }}"
        cluster_pb_store_record_note: "throwaway self-test record — deleted in the same run (#165)"
      when: cluster_pb_selftest | bool
    - name: "Read the record back"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
        tasks_from: record_read
      vars:
        cluster_pb_store_record_name: "{{ pb_selftest_record_name }}"
      when: cluster_pb_selftest | bool
    - name: "Assert the read-back value matches what was written"
      ansible.builtin.assert:
        that:
          - __pb_record_found | bool
          - __pb_record_read_value == __selftest_value
        fail_msg: >-
          Round-trip failed: found={{ __pb_record_found }} — the write/read
          primitives do not agree. Do NOT build Phase B on this.
        quiet: true
      no_log: true
      when: cluster_pb_selftest | bool
    - name: "Unauthenticated list of the collection"
      ansible.builtin.uri:
        url: >-
          {{ cluster_pb_store_base_url | default('https://127.0.0.1:8080')
          }}/api/collections/gs_infra_credentials/records
        method: GET
        validate_certs: false
        status_code: [200, 400, 401, 403]
      register: __pb_unauth_list
      changed_when: false
      when: cluster_pb_selftest | bool
    - name: "Assert the unauthenticated list leaked NOTHING"
      ansible.builtin.assert:
        that: (__pb_unauth_list.json['items'] | default([])) | length == 0
        fail_msg: >-
          RULE FAILURE: an unauthenticated list of gs_infra_credentials
          returned {{ (__pb_unauth_list.json['items'] | default([])) | length }}
          item(s) (HTTP {{ __pb_unauth_list.status }}). The listRule is not
          protecting the collection — STOP and fix before any Phase-B
          migration.
        success_msg: >-
          Unauthenticated list returned no data
          (HTTP {{ __pb_unauth_list.status }}) — listRule holds.
        quiet: true
      when: cluster_pb_selftest | bool
    - name: "Delete the throwaway record (sanctioned cleanup, #165)"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
        tasks_from: record_delete
      vars:
        cluster_pb_store_record_id: "{{ __pb_record_found_id }}"
      when: cluster_pb_selftest | bool
    - name: "Verify the throwaway record is gone"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
        tasks_from: record_read
      vars:
        cluster_pb_store_record_name: "{{ pb_selftest_record_name }}"
      when: cluster_pb_selftest | bool
    - name: "Assert the cleanup actually removed it"
      ansible.builtin.assert:
        that: not (__pb_record_found | bool)
        fail_msg: >-
          The throwaway self-test record still exists after deletion — clean
          it up via the record_delete primitive and investigate.
        success_msg: "Throwaway record confirmed deleted — collection left empty of test data."
        quiet: true
      when: cluster_pb_selftest | bool
