[defaults]
# The inventory directory is the single config home: hosts.yml plus
# group_vars/<group>/<topic>.yml and host_vars/<host>/<topic>.yml. Plays run
# from this directory need no -i.
inventory = inventory
inject_facts_as_vars = false
ansible_managed = Managed by Ansible (get_sybers.cluster) - do not edit by hand; changes will be overwritten.
interpreter_python = auto_silent
[inventory]
# inventory/secrets/ holds vaulted -e files (never inventory),
# inventory/discovered/ holds the proposal files cluster-discover.yml writes in
# its default mode, and inventory/example/ is the configuration template
# `make config` copies into place; none is parsed as an inventory source.
ignore_patterns = ^(secrets|discovered|example)$
[privilege_escalation]
become = false
become_method = sudo
