---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Adelaide
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Adelaide
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    # The molecule substrate (extensions/molecule/Dockerfile).
    directory: /extensions/molecule
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Adelaide
    cooldown:
      default-days: 7
    labels: [dependencies, container]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    # The controller image (container/Containerfile), on the same base digest.
    directory: /container
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Adelaide
    cooldown:
      default-days: 7
    labels: [dependencies, container]
    commit-message:
      prefix: "chore(deps)"
