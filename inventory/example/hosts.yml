---
# The static controlled host set — the ONLY place hosts and their group
# membership are declared (standards §14). Every other value lives in
# group_vars/<group>/<topic>.yml (cluster-wide) or host_vars/<host>/<topic>.yml
# (per host), one file per topic; nothing is hard-coded in a play or a role.
#
# This is the template: `make config` copies inventory/example/ into
# inventory/, where the real files are untracked (.gitignore). pi-01, pi-02 and
# pi-03 stand for your node names: rename them here and rename the matching
# host_vars/<host>/ directories.
#
# localhost is declared so the controller-side plays (credential store, vault,
# token mint, audit-logging gate) receive group_vars/all like any other host —
# the implicit localhost would not.
proxmox_cluster:
  hosts:
    pi-01:
    pi-02:
    pi-03:
# The node that hosts the Ludus server and the controller-side tooling, and
# where every once-per-cluster step runs. Membership here IS the declaration of
# the "master" role; no other file encodes it.
proxmox_master:
  hosts:
    pi-01:
controller:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
