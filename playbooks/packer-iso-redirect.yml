---
# Report which stock packer templates can be pointed at ISOs the build node
# already holds (cluster_patch_packer_iso). Read-only: the template-rewrite path
# is superseded and the role refuses to write, so there is nothing to roll back.
- name: "Redirect packer templates at locally-held ISOs"
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: ["!all", "!min", "user"]
  pre_tasks:
    - name: "Running as root"
      ansible.builtin.assert:
        that: ansible_facts['user_uid'] | int == 0
        fail_msg: "must run as root — this reads the stock Ludus tree and the node's ISO store"
        quiet: true
  roles:
    - role: get_sybers.cluster.cluster_patch_packer_iso
