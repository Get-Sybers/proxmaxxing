---
# Weekly: raise the pre-commit hook revisions (prek update ->
# .pre-commit-config.yaml) and the collection pins (scripts/upgrade_pins.py ->
# requirements.yml), then open or refresh a single pull request. The bot App
# token is what lets that PR trigger CI.
name: Update pins
on:
  schedule:
    - cron: "15 19 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Mint a bot App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install tooling
        run: |
          python3 -m pip install --user prek==0.5.5 pyyaml==6.0.3 packaging==26.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Update pre-commit hook revisions
        run: prek update
      - name: Raise the requirements.yml pins
        run: python3 scripts/upgrade_pins.py
      - name: Open or refresh the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          add-paths: |
            .pre-commit-config.yaml
            requirements.yml
          branch: automation/update-pins
          commit-message: "build(deps): raise pinned linters and collection versions"
          title: "build(deps): raise pinned linters and collection versions"
          body: |
            Automated weekly dependency bump:

            - `prek update` — pre-commit hook `rev:` pins in `.pre-commit-config.yaml`
            - `scripts/upgrade_pins.py` — Galaxy/git collection pins in `requirements.yml`

            Run `make conform` before merging.
