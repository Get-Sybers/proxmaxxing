---
- name: "Read/verify gs_infra_credentials records via the sanctioned PB path"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Refuse --check"
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: >-
          The reads and decrypts here run regardless of check mode
          (check_mode: false fact-finds), so --check would execute the real
          thing while claiming to simulate it. Re-run without --check —
          the play is read-only against PB either way.
        quiet: true
    - name: "Cluster admission gate"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_preflight
    - name: "Pb_read_records must name at least one record"
      ansible.builtin.assert:
        that:
          - pb_read_records is defined
          - pb_read_records is not mapping
          - (pb_read_records is string and (pb_read_records | trim | length > 0))
            or (pb_read_records is not string and (pb_read_records | length > 0))
        fail_msg: >-
          Pass -e '{"pb_read_records":["NAME", ...]}' — a list of
          gs_infra_credentials record names (or one name / a comma-separated
          string).
        quiet: true
    - name: "Normalize the targets (name + hashed label, names never surface)"
      ansible.builtin.set_fact:
        __pr_targets: >-
          {%- set raw = (pb_read_records | split(','))
                        if pb_read_records is string else (pb_read_records | list) -%}
          {%- set names = raw | map('string') | map('trim') | select | list -%}
          {%- set out = [] -%}
          {%- for n in names -%}
          {%- set _ = out.append({
                'name': n,
                'label': 'sha256:' ~ (n | hash('sha256') | truncate(12, true, '')) }) -%}
          {%- endfor -%}
          {{ out }}
      no_log: true
    - name: "Normalization must yield at least one target (rule 3)"
      ansible.builtin.assert:
        that: (__pr_targets | length) > 0
        fail_msg: >-
          pb_read_records normalized to ZERO record names — a loop over
          nothing would report success without reading anything.
        quiet: true
    - name: "Derive any unsafe record names (labels only surface)"
      ansible.builtin.set_fact:
        __pr_unsafe: >-
          {{ ((__pr_targets | rejectattr('name', 'match', '^[A-Za-z0-9._-]+$') | list)
              + (__pr_targets | selectattr('name', 'search', '\.\.') | list))
             | map(attribute='label') | unique | list }}
      no_log: true
    - name: "Record names must be plain tokens (no separators, no ..)"
      ansible.builtin.assert:
        that: (__pr_unsafe | length) == 0
        fail_msg: >-
          Record name(s) {{ __pr_unsafe | join(', ') }} contain '..' or
          characters outside [A-Za-z0-9._-] — such a name could escape
          pb_read_expect_dir or mangle the PB filter. Refusing.
        quiet: true
    - name: "Resolve the AES-GCM helper shipped beside this play"
      ansible.builtin.set_fact:
        __pr_helper: "{{ playbook_dir }}/files/pb-aesgcm.py"
    - name: "Read the current database_encryption_key"
      ansible.builtin.slurp:
        src: "{{ ludus_config_path }}"
      register: __pr_cfg
      no_log: true
    - name: "Derive the DEK (no_log)"
      ansible.builtin.set_fact:
        __pr_dek: >-
          {{ (__pr_cfg.content | b64decode | from_yaml).database_encryption_key
             | default('', true) or dek_public_default }}
      no_log: true
    - name: "REFUSE the public default DEK (#173)"
      ansible.builtin.assert:
        that:
          - (__pr_dek | length) == 32
          - __pr_dek != dek_public_default
        fail_msg: >-
          Ludus's database_encryption_key is absent or still the PUBLIC
          DEFAULT. Records "verified" under that key prove nothing — rotate
          first (cluster-dek-rotate.yml,
        quiet: true
      no_log: true
    - name: "Authenticate to PocketBase as the superuser"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
        tasks_from: auth_superuser
    - name: "Fact-find the credentials collection"
      ansible.builtin.include_role:
        name: get_sybers.cluster.cluster_pb_store
        tasks_from: collection_facts
    - name: "Refuse unless the collection exists with the ruled ACLs"
      ansible.builtin.assert:
        that:
          - __pb_collection_present | bool
          - __pb_collection_rules_match | bool
        fail_msg: >-
          gs_infra_credentials is absent or its API rules have drifted from the
          reads from it.
        quiet: true
    - name: "Each record: exists in PB + decrypts under the current DEK"
      ansible.builtin.include_tasks: tasks/pb-credential-read-one.yml
      loop: "{{ __pr_targets }}"
      loop_control:
        label: "{{ item.label }}"
      when: pb_read_expect_dir | length == 0
    - name: "Each record: read back + byte-identical to the expected file"
      ansible.builtin.include_tasks: tasks/pb-credential-verify-one.yml
      loop: "{{ __pr_targets }}"
      loop_control:
        label: "{{ item.label }}"
      when: pb_read_expect_dir | length > 0
    - name: "Forget the last decrypted value"
      ansible.builtin.set_fact:
        __pr_readback: ""
      no_log: true
    - name: "Counts and hashed labels only"
      ansible.builtin.debug:
        msg:
          mode: "{{ 'verify (against ' ~ pb_read_expect_dir ~ ')' if pb_read_expect_dir | length > 0 else 'read' }}"
          records: "{{ __pr_results | default([]) }}"
          all_retrievable: "{{ __pr_results | default([]) | length == __pr_targets | length }}"
