---
- name: "credential_fetch_apikey | Read the record from PocketBase with the caller's API key"
  ansible.builtin.uri:
    url: >-
      {{ cluster_ludus_auth_pb_url }}/api/collections/{{
      cluster_ludus_auth_pb_collection }}/records?filter={{
      ("name='" ~ cluster_ludus_auth_record ~ "'") | urlencode }}
    method: GET
    headers:
      X-API-KEY: "{{ lookup('env', 'LUDUS_API_KEY') }}"
    validate_certs: false
    status_code: [200]
  register: __cla_pb_read
  no_log: true
  check_mode: false
  changed_when: false
- name: "credential_fetch_apikey | Derive found/value facts from the response (value no_log)"
  ansible.builtin.set_fact:
    __pb_record_found: "{{ (__cla_pb_read.json['items'] | length) > 0 }}"
    __pb_record_found_id: "{{ (__cla_pb_read.json['items'] | first | default({})).id | default('') }}"
    __pb_record_read_value: "{{ (__cla_pb_read.json['items'] | first | default({})).value | default('') }}"
  no_log: true
- name: "credential_fetch_apikey | Report SHAPE only (hashed label, never the name)"
  ansible.builtin.debug:
    msg: >-
      Record sha256:{{ cluster_ludus_auth_record | hash('sha256') | truncate(12, true, '') }}
      read via Ludus API-key auth: found={{ __pb_record_found }},
      value length={{ __pb_record_read_value | length }}.
