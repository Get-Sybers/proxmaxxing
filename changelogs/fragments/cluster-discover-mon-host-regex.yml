---
fixed:
  - >-
    ``cluster_discover`` — the ``gather_cluster`` step that reads Ceph's
    ``mon_host`` out of ``ceph.conf`` wrote its ``regex_search`` pattern and
    ``\1`` backreference with doubled backslashes inside a folded (``>-``)
    scalar, so the filter received literal ``\\`` sequences. On a cluster whose
    Ceph section is present but whose ``ceph.conf`` has no matching
    ``mon_host =`` line, ``regex_search`` then raised ``'NoneType' object has no
    attribute 'group'`` and aborted the entire discovery run. Written with
    single backslashes (the correct spelling for a folded scalar) the lookup
    returns the value on a match and ``none`` on no match, matching the two
    sibling ``regex_search`` calls in the same block.
