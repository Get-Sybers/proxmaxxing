---
- name: "config | The server config file must exist"
  ansible.builtin.stat:
    path: "{{ cluster_ludus_install_root }}/config.yml"
  register: __clc_cfg

- name: "config | Fail clearly when config.yml is absent"
  ansible.builtin.assert:
    that: __clc_cfg.stat.exists
    fail_msg: >-
      {{ cluster_ludus_install_root }}/config.yml does not exist. The installer
      writes it on first run — install Ludus (or enable
      cluster_ludus_install_run_installer) before reconciling its config.
    quiet: true

- name: "config | Read config.yml (captures the secret keys; they are never rewritten)"
  ansible.builtin.slurp:
    src: "{{ cluster_ludus_install_root }}/config.yml"
  register: __clc_before_raw
  no_log: true

- name: "config | Decode the current config once"
  ansible.builtin.set_fact:
    __clc_before: "{{ __clc_before_raw.content | b64decode }}"
  no_log: true

- name: "config | Remember the database_encryption_key line before any edit"
  ansible.builtin.set_fact:
    __clc_dek_before: >-
      {{ __clc_before | regex_search('(?m)^database_encryption_key:.*$') | default('', true) }}
  no_log: true

- name: "config | Each configured secret must already match the live config (never rewritten)"
  ansible.builtin.assert:
    that: >-
      __clc_before is search('(?m)^' ~ (item.key | regex_escape) ~ ':\s*'
                             ~ (item.value | string | regex_escape) ~ '\s*$')
    fail_msg: >-
      {{ item.key }} in {{ cluster_ludus_install_root }}/config.yml does not match the
      value configured in ludus_config (from inventory/secrets/ludus.yml). This role
      never rewrites a secret key, so it refuses rather than brick the store — fix the
      vaulted value to match the running server, or rotate the key with
      playbooks/cluster-dek-rotate.yml. (Values are not shown.)
    quiet: true
  no_log: true
  loop: >-
    {{ cluster_ludus_install_config | dict2items
       | selectattr('key', 'in', cluster_ludus_install_secret_keys)
       | rejectattr('value', 'none')
       | rejectattr('value', 'eq', '') | list }}
  loop_control:
    label: "{{ item.key }}"

- name: "config | Build the reconcile set (skip secrets, network opt-in and empty values)"
  ansible.builtin.set_fact:
    __clc_items: >-
      {{ cluster_ludus_install_config | dict2items
         | rejectattr('key', 'in', cluster_ludus_install_skip_keys)
         | rejectattr('value', 'none')
         | rejectattr('value', 'eq', '') | list }}
    __clc_lines: []

- name: "config | Format each reconciled key as its config.yml scalar"
  ansible.builtin.set_fact:
    __clc_lines: >-
      {{ __clc_lines + [{'key': item.key, 'val': __clc_fmt, 'line': item.key ~ ': ' ~ __clc_fmt}] }}
  vars:
    __clc_fmt: >-
      {{ (item.value | lower) if (item.value is boolean)
         else (item.value | to_json) if (item.value is mapping or (item.value is iterable and item.value is not string))
         else (item.value | string) }}
  loop: "{{ __clc_items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "config | Reconcile each managed key, preserving every other line"
  ansible.builtin.lineinfile:
    path: "{{ cluster_ludus_install_root }}/config.yml"
    regexp: "^{{ item.key | regex_escape }}:"
    line: "{{ item.line }}"
    insertafter: EOF
    backup: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ __clc_lines }}"
  loop_control:
    label: "{{ item.key }}"
  notify: "Restart ludus services"

- name: "config | Re-read config.yml to verify the result on disk"
  ansible.builtin.slurp:
    src: "{{ cluster_ludus_install_root }}/config.yml"
  register: __clc_after_raw
  no_log: true

- name: "config | Decode the reconciled config once"
  ansible.builtin.set_fact:
    __clc_after: "{{ __clc_after_raw.content | b64decode }}"
  no_log: true

- name: "config | The database_encryption_key must be untouched"
  ansible.builtin.assert:
    that: >-
      (__clc_after | regex_search('(?m)^database_encryption_key:.*$') | default('', true))
      == __clc_dek_before
    fail_msg: >-
      database_encryption_key changed during reconcile. That key decrypts every
      stored credential; rewriting it bricks the server. Refusing to continue —
      restore {{ cluster_ludus_install_root }}/config.yml from the .bak this run
      created.
    quiet: true

- name: "config | Every managed key is present with the enforced value on disk"
  ansible.builtin.assert:
    that: >-
      __clc_after is search('(?m)^' ~ (item.key | regex_escape) ~ ':\s*'
                            ~ (item.val | regex_escape) ~ '\s*$')
    fail_msg: >-
      {{ item.key }} is not '{{ item.val }}' in config.yml after reconcile.
    quiet: true
  loop: "{{ __clc_lines }}"
  loop_control:
    label: "{{ item.key }}"
  # Under --check lineinfile only simulates, so the re-read still shows the
  # pre-write file; skip the on-disk assertion rather than false-fail.
  when: not ansible_check_mode
