---
# The house credential store: the encrypted ZFS vault under the master node's
# rpool and the PocketBase records that mirror it. One authoritative value per
# path/dataset; every play-specific name below points at it.
# Copied into place by `make config`; the copy is untracked.

# --- The vault --------------------------------------------------------------
credentials_vault_dataset: rpool/credentials
credentials_vault_dir: /root/ludus-credentials

# cluster-credentials-vault: create/reset the encrypted dataset.
cv_pool: "{{ credentials_vault_dataset.split('/')[0] }}"
cv_dataset: "{{ credentials_vault_dataset }}"
cv_mountpoint: "{{ credentials_vault_dir }}"
cv_staging_mount: /root/.credentials-vault-staging
cv_old_dir_backup: /root/.ludus-credentials-premigration
cv_unlock_script: /usr/local/sbin/unlock-credentials
cv_pb_record: VAULT.passphrase
# The break-glass copy of the vault passphrase: the GitHub repository
# (owner/name) and the Actions secret name `gh secret set` writes it to.
# CHANGE-ME to your repository and secret name; `gh` must be authenticated on
# the master node for the copy to be stored (the play warns and carries on
# otherwise — the PocketBase record is the primary).
cv_gh_repo: CHANGE-ME/CHANGE-ME
cv_gh_secret_name: CHANGE-ME
cv_stage: /dev/shm/.cv-passphrase-stage
# Destructive reset guard: both must be supplied on the command line
# (-e vault_reset=true -e vault_reset_confirm=<token>) to destroy a locked vault.
vault_reset: false
vault_reset_confirm: ""
vault_reset_confirm_token: "DESTROY-THE-LOCKED-VAULT"
vault_reset_pb_record: RA.apikey

# cluster-vault-invariant: the vault holds exactly these at-rest entries.
vault_invariant_dir: "{{ credentials_vault_dir }}"
vault_invariant_dataset: "{{ credentials_vault_dataset }}"
vault_invariant_expected:
  - RA.apikey
vault_invariant_install_user: "{{ ludus_install_user }}"
vault_invariant_collections_path: "{{ ludus_user_collections_path }}"

# cluster-vault-migrate: entries that stay in the vault, and entries retired
# into PocketBase (each with the Ludus-owned file that is its true home).
vault_dir: "{{ credentials_vault_dir }}"
vault_keep_entries:
  - RA.apikey
vault_retire_entries:
  - name: ROOT.apikey
    ludus_own_path: "{{ ludus_root }}/install/root-api-key"
  - name: nexus-admin-password
    ludus_own_path: "{{ ludus_root }}/install/nexus-admin-password"
vault_migrate_remove: false

# --- DEK rotation (cluster-dek-rotate) ---------------------------------------
dek_sqlite_crosscheck: true
dek_verify_api_users:
  - RA
dek_restore_via_api: false
dek_api_passwords: {}
dek_vault_dataset: "{{ credentials_vault_dataset }}"
dek_vault_dir: "{{ credentials_vault_dir }}"

# --- Token restore from PVE (cluster-token-restore-from-pve) ----------------
token_cfg_path: /etc/pve/priv/token.cfg
dek_helper: "{{ playbook_dir }}/files/pb-aesgcm.py"
ludus_token_restore_targets: []

# --- PocketBase credential reads / self-test ---------------------------------
pb_read_expect_dir: ""
cluster_pb_selftest: false
pb_selftest_record_name: gs-selftest-throwaway
