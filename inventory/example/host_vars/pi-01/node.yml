---
# Per-node As-Is record of pi-01 — playbooks/cluster-discover.yml fills it
# from the node (`-e cluster_discover_write=in_place`, or adopt the proposal it
# writes under inventory/discovered/). This template carries only the key
# structure and the one value the plays need before the first discovery run,
# mgmt_ip (ansible_host is read from it; 192.0.2.0/24 is an RFC 5737
# documentation range standing in for your management LAN). Discovery adds the
# corosync id and votes, the PVE version and kernel, the hardware, disks, ZFS
# pools, Ceph roles, interfaces and guests. A fill run (the default) keeps
# every value already here and adds what the node reports; an overwrite run
# (-e cluster_discover_overwrite=true) replaces the discovered values and keeps
# the annotations the node cannot report (a disk's role, an interface's
# purpose). Desired state for this node lives in the other files of this
# directory, never here.
node:
  name: pi-01
  mgmt_ip: 192.0.2.10
  hardware: {}
  disks: []
  zfs_pools: []
  ceph: {}
  network: {}
  guests:
    templates: []
    vms: []
    cts: []
