---
# cluster_preflight negative — on a host that is not a PVE node (/etc/pve
# absent), the admission gate must stop cleanly, never let a cluster play
# proceed. The Debian test container is exactly such a host. No prepare;
# converge drives the controlled failure itself.
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - destroy
