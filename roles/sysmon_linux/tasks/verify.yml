---
# Liveness probe: `systemctl is-active` is a read-only status query with no
# module equivalent; changed_when:false keeps it honest (ansible-standards §Modules).
- name: "verify | Verify — Sysmon service is active"  # noqa: command-instead-of-module
  ansible.builtin.command: "systemctl is-active sysmon"
  register: __sml_active
  changed_when: false
  failed_when: __sml_active.stdout | trim != 'active'
- name: "verify | Verify (e2e) — run a uniquely named process for Sysmon to observe"
  ansible.builtin.command: "/bin/sleep 0.37"
  changed_when: false
- name: "verify | Verify (e2e) — Sysmon logged a ProcessCreate (EventID 1)"
  ansible.builtin.command: "journalctl -u sysmon --since -2min -n 300 --no-pager"
  register: __sml_events
  changed_when: false
  failed_when: false
  retries: 6
  delay: 5
  until: (__sml_events.stdout_lines | default([]) | select('search', '<EventID>1</EventID>') | list | length) > 0
- name: "verify | VERIFY — Sysmon eBPF probe is attached and emitting"
  vars:
    __proc_events: "{{ __sml_events.stdout_lines | default([]) | select('search', '<EventID>1</EventID>') | list | length }}"
  ansible.builtin.assert:
    that: __proc_events | int > 0
    success_msg: "Sysmon end-to-end proven: ProcessCreate events are reaching the journal ({{ __proc_events }} in the last 2 min)."
    fail_msg: >-
      Sysmon service is active but NO ProcessCreate events were logged — the eBPF
      probe almost certainly failed to attach on kernel {{ ansible_facts['kernel'] }}.
      Check `journalctl -u sysmon`.
