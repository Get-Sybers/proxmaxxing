---
# The Ludus server's config.yml, as a HOST var of the node that hosts Ludus
# (the proxmox_master; pi-01 in this template). It is a thin projection OF
# proxmox_config: every Proxmox-owned key reads "{{ proxmox_config.* }}", so the
# relationship direction is legible from each line — ludus_config reads
# proxmox_config, never the reverse. The only values owned here are genuinely
# Ludus's own (ports, licence, policy, the NAT interface Ludus creates, the
# reserved range numbers and the vaulted DEK), which reference the ludus_cfg_*
# group vars in group_vars/all/ludus.yml and the ansible-vault file
# inventory/secrets/ludus.yml.
#
# cluster_ludus_install reconciles /opt/ludus/config.yml from this map. A key
# whose resolved value is empty is skipped, so the installer's own value is kept;
# it NEVER rewrites a live database_encryption_key (only verifies it); and the
# host network keys are written only when cluster_ludus_install_manage_network is
# true. When a different node becomes master, move this file (and
# proxmox_config.yml) to that host's host_vars/. Copied into place by
# `make config`; untracked.
ludus_config:
  # --- Projected from proxmox_config (Proxmox-owned) -------------------------
  proxmox_node: "{{ proxmox_config.node }}"
  proxmox_invalid_cert: "{{ proxmox_config.invalid_cert }}"
  proxmox_interface: "{{ proxmox_config.interface }}"
  proxmox_local_ip: "{{ proxmox_config.local_ip }}"
  proxmox_public_ip: "{{ proxmox_config.public_ip }}"
  proxmox_gateway: "{{ proxmox_config.gateway }}"
  proxmox_netmask: "{{ proxmox_config.netmask }}"
  proxmox_vm_storage_pool: "{{ proxmox_config.vm_storage_pool }}"
  proxmox_vm_storage_format: "{{ proxmox_config.vm_storage_format }}"
  proxmox_iso_storage_pool: "{{ proxmox_config.iso_storage_pool }}"
  cluster_mode: "{{ proxmox_config.cluster_mode }}"
  sdn_zone: "{{ proxmox_config.sdn_zone }}"
  vxlan_tag_base: "{{ proxmox_config.vxlan_tag_base }}"

  # --- Owned by Ludus --------------------------------------------------------
  ludus_nat_interface: "{{ ludus_cfg_nat_interface }}"   # the WAN interface Ludus creates on the host
  reserved_range_numbers: "{{ ludus_reserved_range_numbers }}"
  prevent_user_ansible_add: "{{ ludus_cfg_prevent_user_ansible_add }}"
  sso_require_existing_user: "{{ ludus_cfg_sso_require_existing_user }}"
  create_default_range: "{{ ludus_cfg_create_default_range }}"
  license_key: "{{ ludus_cfg_license_key }}"
  expose_admin_port: "{{ ludus_cfg_expose_admin_port }}"
  port: "{{ ludus_cfg_port }}"
  admin_port: "{{ ludus_cfg_admin_port }}"
  wireguard_port: "{{ ludus_cfg_wireguard_port }}"
  data_directory: "{{ ludus_cfg_data_directory }}"
  max_log_history: "{{ ludus_cfg_max_log_history }}"

  # --- Secret (ansible-vault; NEVER rewritten on a live install) -------------
  database_encryption_key: "{{ vault_ludus_database_encryption_key | default('') }}"
