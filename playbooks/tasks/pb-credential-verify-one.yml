---
- name: "pb-credential-verify-one | Read the record back from gs_infra_credentials"
  ansible.builtin.include_role:
    name: get_sybers.cluster.cluster_pb_store
    tasks_from: record_read
  vars:
    cluster_pb_store_record_name: "{{ item.name }}"
- name: "pb-credential-verify-one | The record must exist"
  ansible.builtin.assert:
    that: __pb_record_found | bool
    fail_msg: >-
      Record {{ item.label }} NOT found in gs_infra_credentials — retrieval
      would fail; do NOT dispose of the plaintext copy.
    quiet: true
- name: "pb-credential-verify-one | Decrypt what PB holds (stdin, never argv)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ __pr_helper }}"
  args:
    stdin: >-
      {{ {'op': 'decrypt', 'key': __pr_dek, 'data': __pb_record_read_value}
         | to_json }}
    stdin_add_newline: false
  register: __pr_readback
  no_log: true
  check_mode: false
  changed_when: false
- name: "pb-credential-verify-one | The name is a plain token (defense in depth, before the slurp)"
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - "'..' not in item.name"
    fail_msg: >-
      Record {{ item.label }}: name failed the safe-token check — refusing
      to build a path under pb_read_expect_dir from it.
    quiet: true
  no_log: true
- name: "pb-credential-verify-one | Read the expected plaintext file"
  ansible.builtin.slurp:
    src: "{{ pb_read_expect_dir }}/{{ item.name }}"
  register: __pr_expected
  no_log: true
- name: "pb-credential-verify-one | PROVE the PB value decrypts to the same bytes (trimmed)"
  ansible.builtin.assert:
    that:
      - (__pr_readback.stdout | b64decode) == (__pr_expected.content | b64decode | trim)
    fail_msg: >-
      Record {{ item.label }}: the value stored in gs_infra_credentials does
      NOT decrypt to the expected bytes — do NOT dispose of the plaintext copy
      until this is understood.
    success_msg: >-
      Record {{ item.label }}: retrieved via the sanctioned path and
      byte-identical to the expected plaintext.
    quiet: true
  no_log: true
- name: "pb-credential-verify-one | Record the outcome (hashed label + shape only)"
  ansible.builtin.set_fact:
    __pr_results: >-
      {{ __pr_results | default([]) + [{
           'label': item.label,
           'found': true,
           'value_length': (__pr_readback.stdout | b64decode | length),
           'verified': true
         }] }}
- name: "pb-credential-verify-one | Forget the expected plaintext"
  ansible.builtin.set_fact:
    __pr_expected: ""
  no_log: true
- name: "pb-credential-verify-one | Report"
  ansible.builtin.debug:
    msg: >-
      Record {{ item.label }}: PB-retrievable and byte-identical to the
      expected plaintext (value length {{ (__pr_results | default([]) | last).value_length }}).
