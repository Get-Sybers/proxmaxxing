---
changed:
  - >-
    ``requirements.yml`` now pins the dependency collections (``community.general``,
    ``ansible.posix``, ``community.proxmox`` and the test-only ``community.docker``
    plus its ``community.library_inventory_filtering_v1`` transitive) to git tags on
    their upstream ``ansible-collections`` GitHub repositories instead of a
    ``galaxy.ansible.com`` source. The whole closure is listed explicitly, so
    ``ansible-galaxy collection install -r requirements.yml`` (CI, the container image
    and ``make deps``) resolves entirely from git and never calls the Galaxy API —
    the install now works on managed networks that reach github.com but block Galaxy.
    The tags are the same releases Galaxy serves and stay inside the ``galaxy.yml``
    bounds; ``galaxy.yml`` itself is unchanged, so published consumers resolve the
    dependencies from Galaxy as before.
  - >-
    ``scripts/check_pins.py`` maps a git-sourced entry back to the collection it
    installs as (the fqcn read from the repo URL) so a git-pinned ``galaxy.yml``
    dependency satisfies the bound check exactly as a Galaxy pin does; a git tag is
    the version, a commit SHA records the pin without a numeric bound check.
    ``scripts/upgrade_pins.py`` already raised git pins to the newest in-bound tag.
