---
# Host networking for the Ludus server config.yml — the values specific to THIS
# node (the one hosting Ludus). host_vars/<master>/ludus_config.yml references
# them. playbooks/ludus-config-discover.yml fills them from the live host (the
# interface carrying the default route, its address and netmask, and the
# gateway); set them by hand if you prefer.
#
# Reconciled onto config.yml only when cluster_ludus_install_manage_network is
# true (run-sheet caution C1), so empty values here leave the installer's
# working network untouched. Copied into place by `make config`; untracked.
ludus_net_interface: ""                                 # proxmox_interface, e.g. vmbr0 / ens18
ludus_net_local_ip: "{{ node.mgmt_ip | default('') }}"  # proxmox_local_ip (defaults to the discovered mgmt IP)
ludus_net_public_ip: "{{ ludus_net_local_ip }}"         # proxmox_public_ip (defaults to local)
ludus_net_gateway: ""                                   # proxmox_gateway
ludus_net_netmask: ""                                   # proxmox_netmask
