---
# Where this role writes the discovered Ludus network record.
# additional: a proposal under <inventory_dir>/discovered/host_vars/<host>/ludus_net.yml
#   (Ansible never loads it); diff it and copy it in.
# in_place: rewrite host_vars/<host>/ludus_net.yml in the inventory itself
#   (git keeps the previous version).
cluster_ludus_config_discover_write: additional

# The inventory directory the record is written under (ansible.cfg points -i
# here). The role writes host_vars/<host>/ludus_net.yml beneath it.
cluster_ludus_config_discover_inventory_dir: "{{ inventory_dir }}"

# The host that holds the inventory checkout the record is written to (the
# controller) — the facts are gathered on the Ludus node and the file is written
# here.
cluster_ludus_config_discover_delegate_to: localhost

# Keep a timestamped backup beside a file rewritten in place.
cluster_ludus_config_discover_backup: false
