---
- name: Converge (expect a controlled failure)
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: A non-PVE host must stop at the preflight gate before any sweep
      block:
        - name: Run cluster_ceph_orphan_sweep on a host that is not a PVE node
          ansible.builtin.include_role:
            name: get_sybers.cluster.cluster_ceph_orphan_sweep
          vars:
            cluster_ceph_orphan_sweep_delegate_to: "{{ inventory_hostname }}"
      rescue:
        - name: The preflight gate stopped the sweep (/etc/pve absent)
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - "'not a Proxmox VE node' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              failed, but not at the PVE-node preflight gate:
              {{ ansible_failed_result | default({}) }}
            quiet: true
        - name: Record the controlled failure
          ansible.builtin.set_fact:
            __cos_failed_cleanly: true
    - name: The failure path was taken
      ansible.builtin.assert:
        that:
          - __cos_failed_cleanly | default(false)
        fail_msg: "cluster_ceph_orphan_sweep did not refuse to run on a non-PVE host"
        quiet: true
