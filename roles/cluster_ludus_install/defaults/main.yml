---
# Install root and the (default-off) installer path.
cluster_ludus_install_root: /opt/ludus
cluster_ludus_install_run_installer: false
cluster_ludus_install_binary_url: ""
cluster_ludus_install_binary_checksum: ""
cluster_ludus_install_version: ""

# The config.yml this role reconciles, as ONE map. The master's `ludus_config`
# host var (host_vars/<master>/ludus_config.yml) is the source of truth; it is a
# thin projection OF proxmox_config (the Proxmox-owned facts) plus the ludus_cfg_*
# group vars (the Ludus-owned ones), so a fact has exactly one home. When
# `ludus_config`
# is undefined the role falls back to the safe cluster-mode skeleton below, whose
# site values reference the collection vars directly (each guarded; the skeleton
# cannot reach the inventory's proxmox_config). Every key in the map is reconciled onto
# /opt/ludus/config.yml EXCEPT the secret and host-network keys handled specially
# (see below); keys whose value is empty or null are skipped so the installer's
# own value is kept.
cluster_ludus_install_config: "{{ ludus_config | default(cluster_ludus_install_config_fallback) }}"
cluster_ludus_install_config_fallback:
  proxmox_node: "{{ cluster_master_node | default(inventory_hostname) }}"
  proxmox_vm_storage_pool: "{{ ceph_pool | default('') }}"
  proxmox_vm_storage_format: raw
  proxmox_iso_storage_pool: local
  reserved_range_numbers: "{{ ludus_reserved_range_numbers | default([]) }}"
  cluster_mode: true
  sdn_zone: "{{ sdn_zone | default('') }}"
  vxlan_tag_base: "{{ sdn_vxlan_tag_base | default(0) }}"

# Secret keys of config.yml: NEVER written by the reconcile. When one is set in
# the map (from the ansible-vault file) the role asserts the LIVE value matches
# it, then leaves it untouched — rewriting database_encryption_key decrypts
# nothing and bricks the credential store.
cluster_ludus_install_secret_keys:
  - database_encryption_key

# Host NETWORK keys: reconciled ONLY when cluster_ludus_install_manage_network is
# true. Default false so the working (Ceph-mesh) network is never restyled by a
# wrong guess (run-sheet caution C1). Their values come from the same map
# (proxmox_config, which reads the node record filled by playbooks/cluster-discover.yml).
cluster_ludus_install_manage_network: false
cluster_ludus_install_network_keys:
  - proxmox_interface
  - proxmox_local_ip
  - proxmox_public_ip
  - proxmox_gateway
  - proxmox_netmask

# Stage the ROOT API key into the house credential store so cluster_secrets'
# primary path resolves it (it also has an install-path fallback).
cluster_ludus_install_stage_root_key: true
cluster_ludus_install_vault_dir: /root/ludus-credentials

# Prove the acting key authenticates after reconcile (needs LUDUS_API_KEY in the
# environment, e.g. from playbooks/ludus-ra-auth.yml). Off by default.
cluster_ludus_install_verify_whoami: false
cluster_ludus_install_api_url: "https://127.0.0.1:8080/api/v2"
cluster_ludus_install_validate_certs: false
