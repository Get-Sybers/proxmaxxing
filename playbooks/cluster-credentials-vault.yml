---
- name: "Encrypted dataset under the credential store"
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: cv_passphrase
      prompt: >-
        New vault passphrase (min 8 chars, no leading/trailing whitespace — on
        create this play stores it automatically: the PocketBase record
        cv_pb_record + the GitHub Actions break-glass secret cv_gh_secret_name)
      private: true
      confirm: true
  tasks:
    - name: "Passphrase length sane (zfs minimum is 8), no edge whitespace"
      ansible.builtin.assert:
        that:
          - cv_passphrase | length >= 8
          - cv_passphrase == (cv_passphrase | trim)
        fail_msg: >-
          Passphrase must be at least 8 characters and carry no leading or
          trailing whitespace.
        quiet: true
      no_log: true
    - name: "Pool exists and is healthy — {{ cv_pool }}"
      ansible.builtin.command:
        argv: [zpool, list, -H, -o, health, "{{ cv_pool }}"]
      register: cv_pool_health
      changed_when: false
      failed_when: cv_pool_health.stdout | trim != 'ONLINE'
    - name: "Does the dataset already exist?"
      ansible.builtin.command:
        argv: [zfs, list, -H, -o, name, "{{ cv_dataset }}"]
      register: cv_ds_check
      changed_when: false
      failed_when: false
    - name: "Current credential dir state"
      ansible.builtin.stat:
        path: "{{ cv_mountpoint }}"
      register: cv_dir_stat
    - name: "Destroy the locked vault, PB copy proven first"
      when: vault_reset | bool
      block:
        - name: "Refuse unless the confirm token matches exactly"
          ansible.builtin.assert:
            that: vault_reset_confirm == vault_reset_confirm_token
            fail_msg: >-
              vault_reset=true requires the second explicit confirmation:
              -e vault_reset_confirm={{ vault_reset_confirm_token }}.
              This DESTROYS {{ cv_dataset }} and everything in it.
            quiet: true
        - name: "Refuse when there is no dataset to reset"
          ansible.builtin.assert:
            that: cv_ds_check.rc == 0
            fail_msg: >-
              {{ cv_dataset }} does not exist — there is nothing to reset.
              Re-run WITHOUT vault_reset to create a fresh vault.
            quiet: true
        - name: "Read the dataset's keystatus"
          community.general.zfs_facts:
            name: "{{ cv_dataset }}"
            properties: keystatus
          register: cv_reset_zfs
        - name: "Refuse to destroy an unlocked/healthy vault"
          vars:
            __cvr: "{{ cv_reset_zfs.ansible_facts.ansible_zfs_datasets | first }}"
          ansible.builtin.assert:
            that: __cvr.keystatus != 'available'
            fail_msg: >-
              {{ cv_dataset }} keystatus is 'available' — the vault is
              UNLOCKED and its contents readable. vault_reset exists for a
              genuinely locked, passphrase-lost dataset only. If you really
              mean to rebuild a healthy vault, migrate its contents out and
              destroy it by hand.
            quiet: true
        - name: "Authenticate to PocketBase as the superuser"
          ansible.builtin.include_role:
            name: get_sybers.cluster.cluster_pb_store
            tasks_from: auth_superuser
        - name: "Read the record {{ vault_reset_pb_record }}"
          ansible.builtin.include_role:
            name: get_sybers.cluster.cluster_pb_store
            tasks_from: record_read
          vars:
            cluster_pb_store_record_name: "{{ vault_reset_pb_record }}"
        - name: "Refuse unless RA's key is homed in PocketBase"
          ansible.builtin.assert:
            that: __pb_record_found | bool
            fail_msg: >-
              No {{ vault_reset_pb_record }} record in gs_infra_credentials —
              destroying the vault now could lose the only copy of RA's key.
              Mint and home one first: playbooks/ludus-key-rotate.yml.
            quiet: true
        - name: "Destroy {{ cv_dataset }}"
          ansible.builtin.command:
            argv: [zfs, destroy, "{{ cv_dataset }}"]
          changed_when: true
        - name: "Re-check dataset existence so the create path fires"
          ansible.builtin.command:
            argv: [zfs, list, -H, -o, name, "{{ cv_dataset }}"]
          register: cv_ds_check
          changed_when: false
          failed_when: false
    - name: "Create encrypted dataset and migrate the store"
      when: cv_ds_check.rc != 0
      block:
        - name: "Create (aes-256-gcm, passphrase) at a staging mountpoint for {{ cv_dataset }}"
          ansible.builtin.shell: |
            set -o pipefail
            printf '%s\n%s\n' "$CV_PASS" "$CV_PASS" | zfs create \
              -o encryption=aes-256-gcm \
              -o keyformat=passphrase \
              -o keylocation=prompt \
              -o mountpoint={{ cv_staging_mount }} \
              -o atime=off \
              {{ cv_dataset }}
          args:
            executable: /bin/bash
          environment:
            CV_PASS: "{{ cv_passphrase }}"
          no_log: true
          changed_when: true
        - name: "Lock down the staging mountpoint itself"
          ansible.builtin.file:
            path: "{{ cv_staging_mount }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
        - name: "Copy the existing store in (permissions/ownership preserved)"
          ansible.builtin.shell: |
            set -e
            if [ -d "$SRC" ]; then
              cp -a "$SRC"/. "$DST"/
            fi
            true
          args:
            executable: /bin/bash
          environment:
            SRC: "{{ cv_mountpoint }}"
            DST: "{{ cv_staging_mount }}"
          no_log: true
          changed_when: true
        - name: "Verify file count matches source"
          ansible.builtin.shell: |
            set -o pipefail
            S=0; [ -d "$SRC" ] && S=$(find "$SRC" -type f | wc -l)
            D=$(find "$DST" -type f | wc -l)
            echo "$S $D"
            [ "$S" -eq "$D" ]
          args:
            executable: /bin/bash
          environment:
            SRC: "{{ cv_mountpoint }}"
            DST: "{{ cv_staging_mount }}"
          register: cv_copy_check
          changed_when: false
        - name: "Move the plaintext dir aside and take over the mountpoint"
          ansible.builtin.shell: |
            set -e
            if [ -d "$SRC" ]; then mv "$SRC" "$BAK"; fi
            zfs set mountpoint="$SRC" {{ cv_dataset }}
          args:
            executable: /bin/bash
          environment:
            SRC: "{{ cv_mountpoint }}"
            BAK: "{{ cv_old_dir_backup }}"
          no_log: true
          changed_when: true
    - name: "Key loaded?"
      ansible.builtin.command:
        argv: [zfs, get, -H, -o, value, keystatus, "{{ cv_dataset }}"]
      register: cv_keystatus
      changed_when: false
    - name: "Load the key if needed (unlock path, idempotent)"
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s\n' "$CV_PASS" | zfs load-key {{ cv_dataset }}
      args:
        executable: /bin/bash
      environment:
        CV_PASS: "{{ cv_passphrase }}"
      when: cv_keystatus.stdout | trim != 'available'
      no_log: true
      changed_when: true
    - name: "Mounted?"
      ansible.builtin.command:
        argv: [zfs, get, -H, -o, value, mounted, "{{ cv_dataset }}"]
      register: cv_mounted
      changed_when: false
    - name: "Mount if needed"
      ansible.builtin.command:
        argv: [zfs, mount, "{{ cv_dataset }}"]
      changed_when: true
      when: cv_mounted.stdout | trim != 'yes'
    - name: "Unlock helper for post-reboot use"
      ansible.builtin.copy:
        dest: "{{ cv_unlock_script }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          set -e
          zfs load-key {{ cv_dataset }}
          zfs mount {{ cv_dataset }} 2>/dev/null || true
          zfs get -H -o value keystatus,mounted {{ cv_dataset }}
          echo "credential store unlocked and mounted"
    - name: "Read each vault property alone"
      ansible.builtin.command:
        argv: [zfs, get, -H, -o, value, "{{ item }}", "{{ cv_dataset }}"]
      loop: [encryption, keystatus, mounted, mountpoint]
      register: cv_verify
      changed_when: false
    - name: "Encryption on, key available, mounted at the store path"
      ansible.builtin.assert:
        that:
          - (cv_verify.results[0].stdout | trim) == 'aes-256-gcm'
          - (cv_verify.results[1].stdout | trim) == 'available'
          - (cv_verify.results[2].stdout | trim) == 'yes'
          - (cv_verify.results[3].stdout | trim) == cv_mountpoint
        fail_msg: |
          Vault verify failed:
          encryption={{ cv_verify.results[0].stdout | trim }}
          keystatus={{ cv_verify.results[1].stdout | trim }}
          mounted={{ cv_verify.results[2].stdout | trim }}
          mountpoint={{ cv_verify.results[3].stdout | trim }}
          (expected aes-256-gcm / available / yes / {{ cv_mountpoint }})
        quiet: true
    - name: "Store directory is root-only"
      ansible.builtin.stat:
        path: "{{ cv_mountpoint }}"
      register: cv_mp_stat
      failed_when: >-
        not cv_mp_stat.stat.exists
        or cv_mp_stat.stat.pw_name != 'root'
    - name: "Store the NEW passphrase in PocketBase + GitHub"
      when: cv_ds_check.rc != 0
      block:
        - name: "Resolve the AES-GCM helper shipped beside the cluster plays"
          ansible.builtin.set_fact:
            __vm_helper: "{{ playbook_dir }}/files/pb-aesgcm.py"
        - name: "Read the current database_encryption_key"
          ansible.builtin.slurp:
            src: "{{ ludus_config_path }}"
          register: __cv_cfg
          no_log: true
        - name: "Derive the DEK (no_log)"
          ansible.builtin.set_fact:
            __vm_dek: >-
              {{ (__cv_cfg.content | b64decode | from_yaml).database_encryption_key
                 | default('', true) or dek_public_default }}
          no_log: true
        - name: "REFUSE the public default DEK (#173)"
          ansible.builtin.assert:
            that:
              - (__vm_dek | length) == 32
              - __vm_dek != dek_public_default
            fail_msg: >-
              DEK is the public default or not 32 bytes — run
              cluster-dek-rotate.yml first. The new passphrase was NOT homed;
              re-run this play's unlock path afterwards or home it by hand.
            quiet: true
          no_log: true
        - name: "Authenticate to PocketBase as the superuser"
          ansible.builtin.include_role:
            name: get_sybers.cluster.cluster_pb_store
            tasks_from: auth_superuser
        - name: "Fact-find the credentials collection"
          ansible.builtin.include_role:
            name: get_sybers.cluster.cluster_pb_store
            tasks_from: collection_facts
        - name: "Refuse unless Phase A applied"
          ansible.builtin.assert:
            that:
              - __pb_collection_present | bool
              - __pb_collection_rules_match | bool
            fail_msg: >-
              gs_infra_credentials missing/ACL-drifted — run
              cluster-pb-credentials-setup.yml first. The new passphrase was
              NOT homed.
            quiet: true
        - name: "Staged copy lives only inside this block (always-shredded)"
          block:
            - name: "Stage the passphrase (0400 root, tmpfs, never argv)"
              ansible.builtin.copy:
                content: "{{ cv_passphrase }}\n"
                dest: "{{ cv_stage }}"
                owner: root
                group: root
                mode: "0400"
              no_log: true
            - name: "PB-home it (encrypt → write → read back → prove, audited path)"
              ansible.builtin.include_tasks: tasks/vault-migrate-one.yml
              vars:
                item:
                  name: "{{ cv_pb_record }}"
                  path: "{{ cv_stage }}"
                  label: "sha256:{{ cv_pb_record | hash('sha256') | truncate(12, true, '') }}"
            - name: "Is gh authenticated on this host?"
              ansible.builtin.command:
                argv: [gh, auth, status]
              register: __cv_gh_auth
              changed_when: false
              failed_when: false
            - name: "Publish the break-glass copy as the GH Actions secret (argv list, value on stdin)"
              ansible.builtin.command:
                argv:
                  - gh
                  - secret
                  - set
                  - "{{ cv_gh_secret_name }}"
                  - --repo
                  - "{{ cv_gh_repo }}"
                stdin: "{{ cv_passphrase }}"
                stdin_add_newline: false
              when: (__cv_gh_auth.rc | default(1)) == 0
              register: __cv_gh_set
              changed_when: true
              failed_when: false
              no_log: true
            - name: "WARN when the GitHub copy could not be stored"
              ansible.builtin.debug:
                msg: >-
                  WARNING: GitHub Actions secret {{ cv_gh_secret_name }} was
                  NOT updated ({{ 'gh unavailable or not authenticated'
                              if (__cv_gh_auth.rc | default(1)) != 0
                              else 'gh secret set failed, rc='
                                   ~ (__cv_gh_set.rc | default('?')) }}).
                  The PocketBase copy ({{ cv_pb_record }}) IS stored and
                  verified — that is the primary. When gh works again, set the
                  break-glass copy by hand, value on stdin, never argv:
                  gh secret set {{ cv_gh_secret_name }} --repo {{ cv_gh_repo }}
              when: >-
                (__cv_gh_auth.rc | default(1)) != 0
                or (__cv_gh_set.rc | default(1)) != 0
          always:
            - name: "Shred the staged passphrase file (runs even on failure)"
              ansible.builtin.command:
                argv: ["shred", "-u", "{{ cv_stage }}"]
                removes: "{{ cv_stage }}"
              changed_when: true
            - name: "Staged file must be gone"
              ansible.builtin.stat:
                path: "{{ cv_stage }}"
              register: __cv_stage_stat
              failed_when: __cv_stage_stat.stat.exists
        - name: "Forget the DEK fact"
          ansible.builtin.set_fact:
            __vm_dek: ""
          no_log: true
        - name: "Report (shape only)"
          ansible.builtin.debug:
            msg: >-
              New passphrase homed — PocketBase {{ cv_pb_record }}:
              {{ __vm_migrated | default([]) }}; GitHub secret {{ cv_gh_secret_name }}:
              {{ 'stored' if (__cv_gh_set.rc | default(1)) == 0
                 else 'NOT stored — see the warning above' }}.
    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          Credential vault active: {{ cv_dataset }} (aes-256-gcm) mounted at
          the store path, key loaded. Post-reboot unlock: {{ cv_unlock_script }}.
          Once you confirm contents, remove the premigration plaintext dir.
