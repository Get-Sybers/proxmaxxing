---
argument_specs:
  main:
    short_description: "Install (optionally) and idempotently reconcile a Ludus server for this Proxmox cluster."
    description:
      - >-
        Ensures the Ludus install at O(cluster_ludus_install_root) is present and
        that its C(config.yml) matches the single C(ludus_config) map the
        inventory declares (the master's host_vars/<master>/ludus_config.yml).
        Every key in the
        map is reconciled onto C(config.yml) except the secret keys (verified
        against the running server but never rewritten) and the host network keys
        (reconciled only on explicit opt-in). Stages the ROOT API key into the
        house credential store and verifies the result. A second run reports
        C(changed=0).
      - >-
        O(cluster_ludus_install_config) defaults to the inventory's C(ludus_config)
        and falls back to a safe cluster-mode skeleton whose site values reference
        the collection variables the inventory defines (standards §4d). A key
        whose value is empty or null is skipped, so the installer's own value is
        kept.
    options:
      cluster_ludus_install_root:
        type: str
        required: false
        default: "/opt/ludus"
        description: "The Ludus install root (where config.yml and install/root-api-key live)."
      cluster_ludus_install_run_installer:
        type: bool
        required: false
        default: false
        description:
          - >-
            When true AND no install is found, download and run the official
            C(ludus-server) binary non-interactively (C(--no-prompt)) to perform a
            first install.
          - >-
            Default false: the role asserts an install is present and only
            reconciles it. On a fresh Debian host the installer may reboot — run it
            attended.
      cluster_ludus_install_binary_url:
        type: str
        required: false
        default: ""
        description: "URL of the C(ludus-server) binary to download when O(cluster_ludus_install_run_installer) is true (required in that case)."
      cluster_ludus_install_binary_checksum:
        type: str
        required: false
        default: ""
        description: "Optional C(algo:hex) checksum for the downloaded binary (passed to C(get_url))."
      cluster_ludus_install_version:
        type: str
        required: false
        default: ""
        description: "Expected Ludus server version string; when set, the role asserts C(ludus version) reports it."
      cluster_ludus_install_config:
        type: dict
        required: false
        default: "{{ ludus_config | default(cluster_ludus_install_config_fallback) }}"
        description:
          - >-
            The C(config.yml) keys to reconcile, as ONE map — the master's
            C(ludus_config) host var is the source of truth. Keys are written verbatim as
            C(config.yml) scalars (booleans lowercased, lists/dicts as JSON);
            empty or null values are skipped.
          - >-
            Secret keys (O(cluster_ludus_install_secret_keys)) are only verified,
            never written; host network keys (O(cluster_ludus_install_network_keys))
            are written only when O(cluster_ludus_install_manage_network) is true.
      cluster_ludus_install_config_fallback:
        type: dict
        required: false
        description:
          - >-
            The safe cluster-mode skeleton used when the inventory defines no
            C(ludus_config). Its site values reference C(cluster_master_node),
            C(ceph_pool), C(sdn_zone), C(sdn_vxlan_tag_base) and
            C(ludus_reserved_range_numbers) (each guarded), so defaults name no
            site fact (standards §4d).
      cluster_ludus_install_secret_keys:
        type: list
        elements: str
        required: false
        default: [database_encryption_key]
        description: >-
          C(config.yml) keys that are secrets: the role asserts the live value
          matches the one in the map (when set) and NEVER rewrites it, so a wrong
          value cannot brick the credential store.
      cluster_ludus_install_manage_network:
        type: bool
        required: false
        default: false
        description: >-
          When true, also reconcile the host network keys
          (O(cluster_ludus_install_network_keys)). Default false so the working
          (Ceph-mesh) network is never restyled by a wrong guess.
      cluster_ludus_install_network_keys:
        type: list
        elements: str
        required: false
        default: [proxmox_interface, proxmox_local_ip, proxmox_public_ip, proxmox_gateway, proxmox_netmask]
        description: >-
          The host network keys of C(config.yml), reconciled only when
          O(cluster_ludus_install_manage_network) is true. Filled from the live
          node record (node.mgmt_*) by C(playbooks/cluster-discover.yml), via proxmox_config.
      cluster_ludus_install_stage_root_key:
        type: bool
        required: false
        default: true
        description: "Stage install/root-api-key into the house credential store so cluster_secrets' primary path resolves the ROOT key."
      cluster_ludus_install_vault_dir:
        type: str
        required: false
        default: "/root/ludus-credentials"
        description: "The house credential store directory the ROOT key is staged into (as ROOT.apikey)."
      cluster_ludus_install_verify_whoami:
        type: bool
        required: false
        default: false
        description: "Prove an exported LUDUS_API_KEY authenticates at /whoami after reconcile. Needs the key in the environment."
      cluster_ludus_install_api_url:
        type: str
        required: false
        default: "https://127.0.0.1:8080/api/v2"
        description: "Ludus user API base URL for the optional /whoami check."
      cluster_ludus_install_validate_certs:
        type: bool
        required: false
        default: false
        description: "Validate the Ludus self-signed TLS certificate for the /whoami check."
