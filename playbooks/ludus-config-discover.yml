---
# Discover the Ludus host's networking and fill the network values of the Ludus
# server config.yml (host_vars/<master>/ludus_net.yml), which
# host_vars/<master>/ludus_config.yml references. The rest of ludus_config is
# desired state (group_vars/all/ludus.yml ludus_cfg_* + the cross-references).
#
#   ansible-playbook playbooks/ludus-config-discover.yml
#       proposal under inventory/discovered/ (never loaded); diff, then adopt
#   ansible-playbook playbooks/ludus-config-discover.yml --check --diff
#       show what would be written, nothing changed
#   ansible-playbook playbooks/ludus-config-discover.yml -e cluster_ludus_config_discover_write=in_place
#       rewrite host_vars/<master>/ludus_net.yml in the inventory
- name: "Discover the Ludus host networking and fill ludus_net.yml"
  hosts: proxmox_master
  gather_facts: true
  gather_subset: ['!all', 'min', 'network']
  roles:
    - role: get_sybers.cluster.cluster_ludus_config_discover
