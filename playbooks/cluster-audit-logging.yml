---
- name: "Audit logging — supply-chain gate and artefact staging"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Gate and stage the artefacts (nothing to gate on a rollback)"
      when: "'rollback' not in ansible_run_tags"
      block:
        - name: "Gate — Nexus is reachable and healthy"
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/status"
            status_code: [200]
          register: __nexus
          retries: 12
          delay: 15
          until: __nexus.status | default(0) == 200
        - name: "Create the controller staging directory"
          ansible.builtin.file:
            path: "{{ audit_stage_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0750"
        - name: "Gate — pull each pinned artefact from NEXUS (digest enforced on download)"
          ansible.builtin.get_url:
            url: "{{ nexus_url }}/repository/{{ nexus_apt_repo }}/{{ item['path'] }}"
            dest: "{{ audit_stage_dir }}/{{ item['deb'] }}"
            checksum: "sha256:{{ item['sha256'] }}"
            owner: root
            group: root
            mode: "0640"
          loop: "{{ audit_artefacts }}"
          loop_control: { label: "{{ item['deb'] }}" }
        - name: "Gate — pull the SAME artefact from UPSTREAM (digest enforced on download)"
          ansible.builtin.get_url:
            url: "{{ upstream_apt_url }}/{{ item['path'] }}"
            dest: "{{ audit_stage_dir }}/.upstream-{{ item['deb'] }}"
            checksum: "sha256:{{ item['sha256'] }}"
            owner: root
            group: root
            mode: "0640"
          loop: "{{ audit_artefacts }}"
          loop_control: { label: "{{ item['deb'] }}" }
        - name: "Gate — checksum both copies independently"
          ansible.builtin.stat:
            path: "{{ audit_stage_dir }}/{{ item[0] }}{{ item[1]['deb'] }}"
            checksum_algorithm: sha256
          loop: "{{ ['', '.upstream-'] | product(audit_artefacts) | list }}"
          loop_control: { label: "{{ item[0] }}{{ item[1]['deb'] }}" }
          register: __copies
        - name: "VERIFY (supply chain) — Nexus bytes == upstream bytes == pinned digest"
          ansible.builtin.assert:
            that:
              - __copies.results | map(attribute='stat.checksum') | unique | length == audit_artefacts | length
              - __copies.results | selectattr('item.1.deb', 'equalto', item['deb'])
                                | map(attribute='stat.checksum') | unique | list == [item.sha256]
            success_msg: "Supply chain OK — {{ item['deb'] }} is byte-identical across Nexus and packages.microsoft.com and matches its pin."
            fail_msg: >-
              SUPPLY CHAIN MISMATCH for {{ item['deb'] }} — refusing to stage.
              pinned={{ item['sha256'] }}
              observed={{ __copies.results | selectattr('item.1.deb', 'equalto', item['deb']) | map(attribute='stat.checksum') | list }}
          loop: "{{ audit_artefacts }}"
          loop_control: { label: "{{ item['deb'] }}" }
- name: "Audit logging — auditd + Sysmon on each Proxmox node"
  hosts: proxmox_cluster
  serial: 1
  gather_facts: true
  become: false
  tasks:
    - name: "Rollback — remove Sysmon + our audit ruleset (guarded)"
      when: "'rollback' in ansible_run_tags"
      tags: [rollback, never]
      block:
        - name: "Rollback — require explicit audit_confirm_rollback"
          ansible.builtin.assert:
            that: audit_confirm_rollback | bool
            fail_msg: "Refusing to roll back without -e audit_confirm_rollback=true."
        - name: "Uninstall Sysmon (removes its unit) if present"
          ansible.builtin.command:
            argv: [sysmon, -u, force]
          register: __sysmonuninstall
          changed_when: __sysmonuninstall.rc == 0
          failed_when: false
        - name: "Remove sysmon + ebpf packages"
          ansible.builtin.apt:
            name: [sysmonforlinux, sysinternalsebpf]
            state: absent
            purge: true
        - name: "Remove our audit ruleset and staged artefacts"
          ansible.builtin.file: { path: "{{ item }}", state: absent }
          loop:
            - "{{ audit_rules_path }}"
            - "{{ sysmon_linux_config_path }}"
            - "{{ audit_node_stage_dir }}"
        - name: "Reload audit rules without our file"
          ansible.builtin.command:
            argv: [augenrules, --load]
          changed_when: true
          failed_when: false
        - name: "Rollback — stop this host after reporting"
          ansible.builtin.meta: end_host
    - name: "Preflight — this is Debian 13 on a PVE kernel"
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] == '13'
          - "'pve' in ansible_facts['kernel']"
        fail_msg: "Unexpected platform: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }} / {{ ansible_facts['kernel'] }}"
    - name: "Preflight — kernel exposes BTF (required by sysinternalsebpf)"
      ansible.builtin.stat: { path: /sys/kernel/btf/vmlinux }
      register: __btf
      failed_when: not __btf.stat.exists
    - name: "Preflight — read pool free space from the Proxmox API"
      ansible.builtin.command:
        argv: [pvesh, get, "/nodes/localhost/disks/zfs/{{ audit_zpool }}", --output-format, json]
      register: __audit_zfs
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "Preflight — enough free space for audit logs"
      vars:
        __avail: "{{ (__audit_zfs.stdout | from_json).free | default(0) | int }}"
      ansible.builtin.assert:
        that:
          - __audit_zfs.rc == 0
          - (__audit_zfs.stdout | from_json).free is defined
          - __avail > (audit_min_free_gb | int) * 1024 * 1024 * 1024
        success_msg: "{{ audit_zpool }} has {{ (__avail / 1073741824) | round(1) }} GiB free (floor {{ audit_min_free_gb }}GB)."
        fail_msg: >-
          {{ audit_zpool }}: not enough free space, or the pool was not readable
          via the Proxmox API (pvesh rc={{ __audit_zfs.rc }}); need
          {{ audit_min_free_gb }}GB free. Refusing to enable audit logging.
    - name: "Preflight — the gated artefacts exist on the controller"
      ansible.builtin.stat: { path: "{{ audit_stage_dir }}/{{ item['deb'] }}" }
      loop: "{{ audit_artefacts }}"
      loop_control: { label: "{{ item['deb'] }}" }
      delegate_to: localhost
      register: __stagecheck
    - name: "Preflight — assert each gated artefact is present on the controller"
      ansible.builtin.assert:
        that: item['stat']['exists']
        fail_msg: "Missing controller artefact: {{ item['item']['deb'] }} — run the gating play first."
      loop: "{{ __stagecheck.results }}"
      loop_control: { label: "{{ item['item']['deb'] }}" }
    - name: "Fact-find: current dpkg state of every package this play installs"
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Status}|${Version}", "{{ item }}"]
      loop: "{{ audit_packages }}"
      register: __pkg_prior
      changed_when: false
      check_mode: false
      failed_when: false
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: capture the bytes of every config file this play rewrites"
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop: "{{ audit_managed_files }}"
      register: __cfg_stat
      check_mode: false
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: slurp the ones that exist"
      ansible.builtin.slurp:
        src: "{{ item['item'] }}"
      loop: "{{ __cfg_stat.results }}"
      loop_control: { label: "{{ item['item'] }}" }
      when: item['stat']['exists']
      register: __cfg_slurp
      check_mode: false
      failed_when: false
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: current enabled/active state of the units this play touches"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          printf '%s|%s' \
            "$(systemctl is-enabled {{ item }} 2>/dev/null || echo unknown)" \
            "$(systemctl is-active  {{ item }} 2>/dev/null || echo unknown)"
        executable: /bin/bash
      loop: "{{ audit_managed_units }}"
      register: __unit_prior
      changed_when: false
      check_mode: false
      failed_when: false
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: the audit rules currently loaded in the KERNEL"
      ansible.builtin.command:
        argv: [auditctl, -l]
      register: __kernel_rules_prior
      changed_when: false
      check_mode: false
      failed_when: false
      tags: [auditd, verify]
    - name: "Fact-find: index the captured prior state per item"
      ansible.builtin.set_fact:
        __prior_pkgs: >-
          {{ __prior_pkgs | default({}) | combine({ item['item']: {
               'installed': (item["rc"] == 0 and 'install ok installed' in item["stdout"]),
               'version': (item["stdout"].split('|')[1] | default('')) if item["rc"] == 0 else '' } }) }}
      loop: "{{ __pkg_prior.results }}"
      loop_control: { label: "{{ item['item'] }}" }
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: index the captured file state per file"
      ansible.builtin.set_fact:
        __prior_cfg: >-
          {{ __prior_cfg | default({}) | combine({ item[0]['item']: {
               'existed': item[0]["stat"]["exists"],
               'mode': item[0]["stat"]["mode"] | default('0640'),
               'owner': item[0]["stat"]["pw_name"] | default('root'),
               'group': item[0]["stat"]["gr_name"] | default('root'),
               'sha256': item[0]["stat"]["checksum"] | default(''),
               'b64': item[1]["content"] | default(''),
               'captured': item[1]["content"] is defined } }) }}
      loop: "{{ __cfg_stat.results | zip(__cfg_slurp.results) | list }}"
      loop_control: { label: "{{ item[0]['item'] }}" }
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: index the captured unit state per unit"
      ansible.builtin.set_fact:
        __prior_units: >-
          {{ __prior_units | default({}) | combine({ item['item']: {
               'enabled': item["stdout"].split('|')[0],
               'active': item["stdout"].split('|')[1] | default('unknown') } }) }}
      loop: "{{ __unit_prior.results }}"
      loop_control: { label: "{{ item['item'] }}" }
      tags: [auditd, sysmon, verify]
    - name: "Fact-find: report the prior state a rescue would put back"
      ansible.builtin.debug:
        msg: |-
          {{ inventory_hostname }} — state captured BEFORE any change:
          packages (NOT rolled back — see the play header):
          {% for n, v in __prior_pkgs.items() %}
            {{ n }}: {{ (v['version'] | default('?')) if v['installed'] else 'NOT INSTALLED' }}
          {% endfor %}
          config files (restored byte-for-byte on failure):
          {% for n, f in __prior_cfg.items() %}
            {{ n }}: {{ ('present, ' ~ f['mode'] ~ ' ' ~ f['owner'] ~ ':' ~ f['group'] ~ ', sha256 ' ~ f['sha256'][:12] ~ '…')
                         if f['existed'] else 'ABSENT (rescue would delete it again)' }}
          {% endfor %}
          units (enabled/active restored on failure):
          {% for n, u in __prior_units.items() %}
            {{ n }}: {{ u['enabled'] }}/{{ u['active'] }}
          {% endfor %}
          kernel audit rules currently loaded: {{ __kernel_rules_prior.stdout_lines | default([]) | length }}
      tags: [auditd, sysmon, verify]
    - name: "Preflight: everything needed for a rollback was actually captured"
      ansible.builtin.assert:
        that:
          - __prior_cfg | length == audit_managed_files | length
          - __prior_units | length == audit_managed_units | length
          - __prior_cfg.values() | selectattr('existed') | rejectattr('captured') | list | length == 0
          - __kernel_rules_prior.rc == 0
        success_msg: >-
          Prior state captured: {{ __prior_cfg | length }} config files
          ({{ __prior_cfg.values() | selectattr('existed') | list | length }} present),
          {{ __prior_units | length }} units,
          {{ __kernel_rules_prior.stdout_lines | default([]) | length }} kernel rules.
        fail_msg: >-
          Refusing to change audit logging: part of the prior state could not be read,
          so it could not be put back on failure.
          files captured={{ __prior_cfg | default({}) | length }}/{{ audit_managed_files | length }},
          units captured={{ __prior_units | default({}) | length }}/{{ audit_managed_units | length }},
          unreadable present files={{ __prior_cfg | default({}) | dictsort
            | selectattr('1.existed') | rejectattr('1.captured') | map(attribute='0') | list | join(', ') or '(none)' }},
          `auditctl -l` rc={{ __kernel_rules_prior.rc | default('?') }}
          (the kernel ruleset is what the rescue compares against).
      tags: [auditd, sysmon, verify]
    - name: "Install and configure audit logging, verify it, and restore the prior state if it does not verify"
      block:
        - name: "Install auditd (pinned)"
          ansible.builtin.apt:
            name: "auditd={{ auditd_version }}"
            state: present
            update_cache: true
            cache_valid_time: 3600
          register: __auditd_install
          tags: [auditd]
        - name: "Install audispd-plugins"
          ansible.builtin.apt: { name: audispd-plugins, state: present }
          tags: [auditd]
        - name: "Configure auditd.conf (rotation + non-fatal disk actions)"
          ansible.builtin.lineinfile:
            path: /etc/audit/auditd.conf
            regexp: "^\\s*{{ item['key'] }}\\s*="
            line: "{{ item['key'] }} = {{ item['value'] }}"
            state: present
          loop:
            - { key: max_log_file, value: "100" }
            - { key: num_logs, value: "10" }
            - { key: max_log_file_action, value: "ROTATE" }
            - { key: space_left, value: "2000" }
            - { key: space_left_action, value: "SYSLOG" }
            - { key: admin_space_left, value: "1000" }
            - { key: admin_space_left_action, value: "SYSLOG" }
            - { key: disk_full_action, value: "ROTATE" }
            - { key: disk_error_action, value: "SYSLOG" }
            - { key: flush, value: "INCREMENTAL_ASYNC" }
            - { key: freq, value: "50" }
          loop_control: { label: "{{ item['key'] }}" }
          tags: [auditd]
        - name: "Ensure the state directory exists"
          ansible.builtin.file:
            path: "{{ audit_state_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          tags: [auditd]
        - name: "Hash the auditd.conf we just rendered"
          ansible.builtin.stat:
            path: /etc/audit/auditd.conf
            checksum_algorithm: sha256
          register: __auditd_conf
          tags: [auditd]
        - name: "Which auditd.conf has actually been signalled into the running daemon?"
          ansible.builtin.slurp:
            src: "{{ audit_state_dir }}/auditd-conf.applied"
          register: __auditd_applied
          failed_when: false
          tags: [auditd]
        - name: "Reload auditd (SIGHUP) when the running daemon predates this config"
          ansible.builtin.command:
            argv: [systemctl, kill, -s, HUP, auditd.service]
          when: >-
            (__auditd_applied.content | default('') | b64decode | trim) != __auditd_conf.stat.checksum
          changed_when: true
          register: __auditd_hup
          tags: [auditd]
        - name: "Record the applied config hash"
          ansible.builtin.copy:
            content: "{{ __auditd_conf.stat.checksum }}"
            dest: "{{ audit_state_dir }}/auditd-conf.applied"
            owner: root
            group: root
            mode: "0600"
          when: not (__auditd_hup is skipped)
          tags: [auditd]
        - name: "Which candidate watch paths exist on this node?"
          ansible.builtin.stat:
            path: "{{ item['path'] }}"
          loop: "{{ audit_watch_candidates }}"
          loop_control: { label: "{{ item['path'] }}" }
          register: __watchstat
          tags: [auditd]
        - name: "Build the node-local watch list"
          ansible.builtin.set_fact:
            audit_watches_present: "{{ __watchstat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
            audit_watches_absent: "{{ __watchstat.results | rejectattr('stat.exists') | map(attribute='item.path') | list }}"
          tags: [auditd]
        - name: "Report watch paths skipped on this node"
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: {{ audit_watches_present | length }}
              watches active; {{ audit_watches_absent | length }} skipped
              (absent): {{ audit_watches_absent }}
          tags: [auditd]
        - name: "Deploy the cluster audit ruleset"
          ansible.builtin.template:
            src: templates/audit-cluster.rules.j2
            dest: "{{ audit_rules_path }}"
            owner: root
            group: root
            mode: "0640"
          notify: load audit rules
          tags: [auditd]
        - name: "Ensure auditd is enabled and running"
          ansible.builtin.systemd_service:
            name: auditd
            enabled: true
            state: started
          tags: [auditd]
        - name: "Apply pending auditd changes before verifying"
          ansible.builtin.meta: flush_handlers
        - name: "Install Sysmon for Linux (delegated to sysmon_linux)"
          ansible.builtin.include_role:
            name: get_sybers.cluster.sysmon_linux
          tags: [sysmon]
        - name: "Verify — auditd reports enabled, non-blocking backlog, non-fatal failure mode"
          ansible.builtin.command:
            argv: [auditctl, -s]
          register: __auditstatus
          changed_when: false
          tags: [verify]
        - name: "Verify — our ruleset is actually loaded in the kernel"
          ansible.builtin.command:
            argv: [auditctl, -l]
          register: __auditrules
          changed_when: false
          tags: [verify]
        - name: "VERIFY — audit subsystem state"
          ansible.builtin.assert:
            that:
              - "'enabled 1' in __auditstatus.stdout"
              - "'failure 1' in __auditstatus.stdout"
              - "'backlog_wait_time 0' in __auditstatus.stdout"
              - __auditrules.stdout_lines | select('search', '(-k |key=)persistence') | list | length > 0
              - __auditrules.stdout_lines | select('search', '(-k |key=)pve_authz') | list | length > 0
              - __auditrules.stdout_lines | select('search', '(-k |key=)privesc') | list | length > 0
              - __auditrules.stdout_lines | select('search', '(-k |key=)identity') | list | length > 0
            success_msg: "auditd enabled, non-blocking, failure=printk, cluster ruleset loaded ({{ __auditrules.stdout_lines | length }} rules)."
            fail_msg: "auditd state wrong — status={{ __auditstatus.stdout }}"
          tags: [verify]
        - name: "Verify (e2e) — the auditctl execution is retrievable via ausearch"
          ansible.builtin.command:
            argv: [ausearch, --input-logs, -k, audit_tools, -ts, today]
          register: __ausearch
          changed_when: false
          failed_when: false
          retries: 6
          delay: 5
          until: "'auditctl' in (__ausearch.stdout | default(''))"
          tags: [verify]
        - name: "VERIFY — auditd captured a real syscall against a watched target"
          ansible.builtin.assert:
            that: "'auditctl' in (__ausearch.stdout | default(''))"
            success_msg: "auditd end-to-end proven: execution of a watched binary was captured and is queryable via ausearch."
            fail_msg: >-
              auditd is running and rules are loaded, but executing a watched binary produced NO
              retrievable record — the ruleset is not effective. Check `auditctl -s` and /var/log/audit/.
          tags: [verify]
        - name: "Verify Sysmon for Linux (delegated to sysmon_linux)"
          ansible.builtin.include_role:
            name: get_sybers.cluster.sysmon_linux
            tasks_from: verify
          tags: [verify]
        - name: "Node summary"
          ansible.builtin.debug:
            msg:
              # yamllint disable rule:line-length
              - "{{ inventory_hostname }}: auditd {{ auditd_version }} + {{ __auditrules.stdout_lines | length }} rules loaded (mutable, non-blocking backlog, ROTATE/SYSLOG disk actions)."
              # yamllint enable rule:line-length
              # yamllint disable rule:line-length
              - "{{ inventory_hostname }}: sysmonforlinux {{ sysmon_version }} + sysinternalsebpf {{ ebpf_version }} (digest-gated via Nexus), probe attached and emitting."
              # yamllint enable rule:line-length
              # yamllint disable rule:line-length
              - "Query: `ausearch -k <key> -ts today` / `journalctl -u sysmon` (Sysmon events are Windows-style XML; EventID 1 = ProcessCreate, 3 = NetworkConnect, 5 = ProcessTerminate, 11 = FileCreate, 23 = FileDelete)."
              # yamllint enable rule:line-length
              # yamllint disable rule:line-length
              - "Audit keys: identity, identity_sudo, privesc, pve_authz, pve_guest_admin, pve_api, pve_cluster, ceph_admin, zfs_admin, persistence, ssh_authz, sshd_config, modules, net_config, frr_config, audit_config, sudo_exec, su_exec, pct_wrapper."
              # yamllint enable rule:line-length
      rescue:
        - name: "Rescue: restore the bytes of every managed config file that EXISTED"
          ansible.builtin.copy:
            content: "{{ item['value']['b64'] | b64decode }}"
            dest: "{{ item['key'] }}"
            owner: "{{ item['value']['owner'] }}"
            group: "{{ item['value']['group'] }}"
            mode: "{{ item['value']['mode'] }}"
          loop: "{{ __prior_cfg | dict2items | selectattr('value.existed') | list }}"
          loop_control: { label: "{{ item['key'] }} <- {{ item['value']['sha256'][:12] }}…" }
          register: __restore_cfg_present
          failed_when: false
        - name: "Rescue: delete every managed config file that did NOT exist"
          ansible.builtin.file:
            path: "{{ item['key'] }}"
            state: absent
          loop: "{{ __prior_cfg | dict2items | rejectattr('value.existed') | list }}"
          loop_control: { label: "{{ item['key'] }} <- back to ABSENT" }
          register: __restore_cfg_absent
          failed_when: false
        - name: "Rescue: reload the restored ruleset into the kernel"
          ansible.builtin.command:
            argv: [augenrules, --load]
          register: __restore_augenrules
          changed_when: true
          failed_when: false
        - name: "Rescue: signal auditd to re-read the restored auditd.conf"
          ansible.builtin.command:
            argv: [systemctl, kill, -s, HUP, auditd.service]
          register: __restore_hup
          changed_when: true
          failed_when: false
        - name: "Rescue: restore each unit's captured enabled/active state"
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              want_en="{{ item['value']['enabled'] }}"; want_ac="{{ item['value']['active'] }}"
              case "$want_en" in enabled) systemctl enable {{ item['key'] }} ;;
                                 disabled) systemctl disable {{ item['key'] }} ;;
                                 *) echo "prior enabled-state was '$want_en' — not reassertable" ;; esac
              case "$want_ac" in active) systemctl start {{ item['key'] }} ;;
                                 inactive|failed) systemctl stop {{ item['key'] }} ;;
                                 *) echo "prior active-state was '$want_ac' — not reassertable" ;; esac
            executable: /bin/bash
          loop: "{{ __prior_units | dict2items }}"
          loop_control: { label: "{{ item['key'] }} <- {{ item['value']['enabled'] }}/{{ item['value']['active'] }}" }
          register: __restore_units
          changed_when: true
          failed_when: false
        - name: "Rescue verify: re-stat every managed config file"
          ansible.builtin.stat:
            path: "{{ item['key'] }}"
            checksum_algorithm: sha256
          loop: "{{ __prior_cfg | dict2items }}"
          loop_control: { label: "{{ item['key'] }}" }
          register: __restore_cfg_stat
          check_mode: false
          failed_when: false
        - name: "Rescue verify: re-read the enabled/active state of every unit"
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              printf '%s|%s' \
                "$(systemctl is-enabled {{ item['key'] }} 2>/dev/null || echo unknown)" \
                "$(systemctl is-active  {{ item['key'] }} 2>/dev/null || echo unknown)"
            executable: /bin/bash
          loop: "{{ __prior_units | dict2items }}"
          loop_control: { label: "{{ item['key'] }}" }
          register: __restore_unit_state
          changed_when: false
          failed_when: false
        - name: "Rescue verify: re-read the KERNEL audit ruleset"
          ansible.builtin.command:
            argv: [auditctl, -l]
          register: __kernel_rules_after
          changed_when: false
          failed_when: false
        - name: "Rescue verify: compare, file by file, what came back against what was captured"
          ansible.builtin.set_fact:
            __cfg_verdicts: >-
              {{ __cfg_verdicts | default([]) + [{
                   'file': item["item"]["key"],
                   'was': ('sha256 ' ~ item["item"]["value"]["sha256"][:12] ~ '… ' ~ item["item"]["value"]["mode"])
                          if item['item']['value']['existed'] else 'ABSENT',
                   'now': ('sha256 ' ~ (item["stat"]["checksum"] | default('?'))[:12] ~ '… ' ~ (item["stat"]["mode"] | default('?')))
                          if item['stat']['exists'] | default(false) else 'ABSENT',
                   'ok': (item["stat"]["exists"] | default(false)) == item["item"]["value"]["existed"]
                         and (((item['stat']['checksum'] | default('')) == item['item']['value']['sha256']
                               and (item['stat']['mode'] | default('')) == item['item']['value']['mode'])
                              if item['item']['value']['existed'] else true) }] }}
          loop: "{{ __restore_cfg_stat.results }}"
          loop_control: { label: "{{ item['item']['key'] }}" }
        - name: "Rescue verify: compare, unit by unit, what came back against what was captured"
          ansible.builtin.set_fact:
            __unit_verdicts: >-
              {{ __unit_verdicts | default([]) + [{
                   'unit': item["item"]["key"],
                   'was': item["item"]["value"]["enabled"] ~ '/' ~ item["item"]["value"]["active"],
                   'now': (item["stdout"] | default('?|?')) | replace('|', '/'),
                   'ok': (item["item"]["value"]["enabled"] ~ '|' ~ item["item"]["value"]["active"]) == (item["stdout"] | default('')) }] }}
          loop: "{{ __restore_unit_state.results }}"
          loop_control: { label: "{{ item['item']['key'] }}" }
        - name: "Rescue verify: is the KERNEL back on the ruleset it had?"
          ansible.builtin.set_fact:
            __kernel_rules_restored: >-
              {{ (__kernel_rules_after.stdout_lines | default([]) | sort)
                 == (__kernel_rules_prior.stdout_lines | default([]) | sort) }}
        - name: "Rescue verify: the rollback verdict"
          ansible.builtin.set_fact:
            __restore_verdict: >-
              {{ (__cfg_verdicts | rejectattr('ok') | list | length) == 0
                 and (__unit_verdicts | rejectattr('ok') | list | length) == 0
                 and __kernel_rules_restored | bool }}
        # yamllint disable rule:line-length
        - name: "Rescue: fail reporting the original error AND the rollback verdict"
          ansible.builtin.fail:
            msg: |-
              AUDIT LOGGING FAILED ON {{ inventory_hostname }}{{ ' AND WAS ROLLED BACK' if __restore_verdict | bool else ' — ROLLBACK INCOMPLETE' }}.
              (1) ORIGINAL FAILURE — task '{{ ansible_failed_task.name | default('unknown') }}':
                  {{ ansible_failed_result.msg | default(ansible_failed_result) | default('(no result captured)') }}
              (2) ROLLBACK: {{ "VERIFIED — every captured file, unit state and the kernel ruleset were re-read and match."
                               if __restore_verdict | bool else
                               "NOT VERIFIED — at least one item does NOT match what was captured, so audit logging on
                                this node is in an UNKNOWN state and needs manual inspection." }}
              {% for v in __cfg_verdicts %}
                  {{ 'OK  ' if v['ok'] else 'FAIL' }} {{ v['file'] }}: captured={{ v['was'] }} now={{ v['now'] }}
              {% endfor %}
              {% for v in __unit_verdicts %}
                  {{ 'OK  ' if v['ok'] else 'FAIL' }} unit {{ v['unit'] }}: captured={{ v['was'] }} now={{ v['now'] }}
              {% endfor %}
                  {{ 'OK  ' if __kernel_rules_restored | bool else 'FAIL' }} kernel ruleset:
                  captured {{ __kernel_rules_prior.stdout_lines | default([]) | length }} rules,
                  now {{ __kernel_rules_after.stdout_lines | default([]) | length }} rules
                  (augenrules rc={{ __restore_augenrules.rc | default('?') }}, SIGHUP rc={{ __restore_hup.rc | default('?') }})
              (3) NOT ROLLED BACK, DELIBERATELY:
                  - the packages. Prior dpkg state WAS captured
                    ({{ __prior_pkgs | dict2items | map(attribute='key') | zip(__prior_pkgs | dict2items | map(attribute='value.version')) | map('join', '=') | list }})
                    but removing a logging daemon because a verification step failed leaves
                    the node LESS observable than before. Use the explicit, confirm-gated
                    path if a real uninstall is wanted:
                    -t rollback -e audit_confirm_rollback=true
                  - /var/log/audit/*. Records already written are append-only history, not
                    configuration state.
                  - any node earlier in the serial:1 order whose verification already PASSED.
         # yamllint enable rule:line-length
  handlers:
    - name: "Load audit rules"
      ansible.builtin.command:
        argv: [augenrules, --load]
      changed_when: true
