---
- name: "credential_decrypt | Assert the identity's key record exists in PocketBase"
  ansible.builtin.assert:
    that: __pb_record_found | bool
    fail_msg: >-
      No key record for identity '{{ cluster_ludus_auth_identity }}' in
      gs_infra_credentials. Store one: mint as an admin and persist with
      playbooks/ludus-key-rotate.yml.
    quiet: true
- name: "credential_decrypt | Decrypt the record value (stdin, never argv)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ cluster_ludus_auth_helper }}"
  args:
    stdin: >-
      {{ {'op': 'decrypt', 'key': __cla_dek, 'data': __pb_record_read_value}
         | to_json }}
    stdin_add_newline: false
  register: __cla_key_raw
  no_log: true
  check_mode: false
  changed_when: false
- name: "credential_decrypt | Register the acting API key (no_log)"
  ansible.builtin.set_fact:
    __cla_api_key: "{{ __cla_key_raw.stdout | b64decode }}"
  no_log: true
- name: "credential_decrypt | Derive NON-SECRET shape facts about the key"
  ansible.builtin.set_fact:
    __cla_key_len: "{{ __cla_api_key | length }}"
    __cla_key_ok_shape: >-
      {{ __cla_api_key is match('^' ~ (cluster_ludus_auth_identity | regex_escape) ~ '\..+')
         and (__cla_api_key | length) > 20 }}
  no_log: true
- name: "credential_decrypt | Assert the decrypted key has the expected shape"
  ansible.builtin.assert:
    that: __cla_key_ok_shape | bool
    fail_msg: >-
      The decrypted key is malformed (length {{ __cla_key_len }}, expected a
      '{{ cluster_ludus_auth_identity }}.'-prefixed value > 20 chars). The
      stored record is broken or truncated — mint and persist a fresh key
      with playbooks/ludus-key-rotate.yml.
    success_msg: >-
      Key for '{{ cluster_ludus_auth_identity }}' decrypted from PocketBase
      (length {{ __cla_key_len }}, shape OK).
    quiet: true
