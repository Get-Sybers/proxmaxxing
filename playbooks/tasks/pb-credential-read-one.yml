---
- name: "pb-credential-read-one | Read the record back from gs_infra_credentials"
  ansible.builtin.include_role:
    name: get_sybers.cluster.cluster_pb_store
    tasks_from: record_read
  vars:
    cluster_pb_store_record_name: "{{ item['name'] }}"
- name: "pb-credential-read-one | The record must exist"
  ansible.builtin.assert:
    that: __pb_record_found | bool
    fail_msg: >-
      Record {{ item['label'] }} NOT found in gs_infra_credentials — a consumer
      fetching this credential would fail.
    quiet: true
- name: "pb-credential-read-one | Decrypt what PB holds (stdin, never argv)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ __pr_helper }}"
  args:
    stdin: >-
      {{ {'op': 'decrypt', 'key': __pr_dek, 'data': __pb_record_read_value}
         | to_json }}
    stdin_add_newline: false
  register: __pr_readback
  no_log: true
  check_mode: false
  changed_when: false
- name: "pb-credential-read-one | The decrypted value must be non-empty"
  ansible.builtin.assert:
    that: (__pr_readback.stdout | b64decode | length) > 0
    fail_msg: >-
      Record {{ item['label'] }} decrypted to ZERO bytes — the stored value is
      empty or corrupt; do not trust this credential.
    quiet: true
  no_log: true
- name: "pb-credential-read-one | Record the outcome (hashed label + shape only)"
  ansible.builtin.set_fact:
    __pr_results: >-
      {{ __pr_results | default([]) + [{
           'label': item["label"],
           'found': true,
           'value_length': (__pr_readback.stdout | b64decode | length),
           'verified': false
         }] }}
- name: "pb-credential-read-one | Report"
  ansible.builtin.debug:
    msg: >-
      Record {{ item['label'] }}: present in gs_infra_credentials and decrypts
      under the current DEK
      (value length {{ (__pr_results | default([]) | last).value_length }}).
